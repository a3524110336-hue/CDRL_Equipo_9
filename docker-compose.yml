services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdrl_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
  app:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdrl_dev_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
        
volumes:
  postgres_data:
  dynamodb_data:
