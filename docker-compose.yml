services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdrl_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-init:
    image: &dynamodb_image amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # La imagen ejecuta Java como UID/GID 1000, pero no contiene data/.
    # Solo se prepara el directorio del volumen; DynamoDB sigue sin ser root.
    command: ["chown 1000:1000 /home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  dynamodb:
    image: *dynamodb_image
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
  app:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      CDRL_READER_PASSWORD: ${CDRL_READER_PASSWORD:?Define CDRL_READER_PASSWORD}
      CDRL_WRITER_PASSWORD: ${CDRL_WRITER_PASSWORD:?Define CDRL_WRITER_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-http://dynamodb:8000}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-cdrl_eventos}
      DYNAMODB_LOCAL: ${DYNAMODB_LOCAL:-true}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    command:
      - /bin/sh
      - -c
      - python -m src.events_store && exec python -m uvicorn src.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_started
        
volumes:
  postgres_data:
  dynamodb_data:
